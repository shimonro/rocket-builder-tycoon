name: Keep Supabase awake

# Free Supabase projects pause after a quiet week. This pings the keepalive() database function
# every 6 hours, alongside the daily Vercel cron in vercel.json. GitHub emails the repo owner if it fails.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Public values: the same URL and publishable key ship in the game's JavaScript.
      SUPABASE_URL: https://mauusienlfbrzwnbvzru.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_j39aphLyJaL_m8vzWoe_lA_WSUo1bAT
    steps:
      - name: Write and read the database
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
