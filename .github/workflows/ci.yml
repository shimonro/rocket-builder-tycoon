name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (100% engine coverage gate)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Edge function bundle
        run: node scripts/deploy-functions.mjs --dry-run
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  # The leaderboard verifier replays flights with the same engine as the client, so it ships with every release:
  # pushes to dev deploy it to the QA project, pushes to main to production.
  deploy-functions:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Supabase edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ github.ref == 'refs/heads/main' && 'mauusienlfbrzwnbvzru' || 'xcjjnkzrnmsljixwfhtz' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Add the SUPABASE_ACCESS_TOKEN repository secret to deploy edge functions automatically."
            exit 0
          fi
          npm run deploy:functions
